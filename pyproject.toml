[project]
name = "upgrade-energy-release-gate"
version = "0.1.0"
description = "Illustrative Supabase + Python release-gate checks for a battery pack traveler (fictional data)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "psycopg[binary]==3.2.10",
  "PyJWT==2.10.1",
  "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "restore: runs against the restored drill instance (scripts/restore_drill.py sets it up)",
]
