name: release-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.3"

      - name: Install pinned Python dependencies
        run: uv sync --frozen

      - name: Run every check (pgTAP, pytest, restore drill, broken variants)
        run: ./scripts/prove.sh

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.sha }}
          path: |
            evidence/
            !evidence/**/backup/
          retention-days: 90
